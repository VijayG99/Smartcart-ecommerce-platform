server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and API docs are served by the Spring Boot container
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /swagger-ui/ { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  # React Router: any other path returns index.html
  location / { try_files $uri /index.html; }
}
