server:
  port: 8080

spring:
  application:
    name: smartcart
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartcart}
    username: ${DB_USERNAME:smartcart}
    password: ${DB_PASSWORD:smartcart}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # dev convenience; use Flyway/Liquibase migrations in real production
    properties:
      hibernate:
        default_batch_fetch_size: 20      # avoids N+1 queries on lazy collections/associations
        jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000                # never block an HTTP request for long if Kafka is down
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.smartcart.event.OrderCreatedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.smartcart.event
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

smartcart:
  jwt:
    # >= 32 characters. Override with JWT_SECRET. The default is for local development ONLY.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  cache:
    product-ttl-minutes: ${PRODUCT_CACHE_TTL_MINUTES:10}
  kafka:
    order-topic: order-events
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  notification:
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_FROM:no-reply@smartcart.local}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    admin-email: ${ADMIN_EMAIL:admin@smartcart.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}   # dev default; always override outside local dev

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    operations-sorter: method

logging:
  level:
    com.smartcart: INFO
