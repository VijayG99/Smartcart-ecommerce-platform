spring:
  datasource:
    url: jdbc:h2:mem:smartcart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple
  kafka:
    listener:
      auto-startup: false

smartcart:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
  seed:
    enabled: false
